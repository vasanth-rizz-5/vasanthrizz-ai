<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VasanthRizz AI Login</title>

    <!-- Favicon -->
    <link rel="icon" href="./img/favicon.ico" type="image/png">

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:title" content="VasanthRizz AI Chat">
    <meta property="og:description" content="Chat smart with VasanthRizz AI – your own intelligent assistant.">
    <meta property="og:image" content="./img/banner.png">
    <meta property="og:url" content="https://vasanth-rizz-5.github.io/vasanthrizz-ai/">
    <meta property="og:type" content="website">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="VasanthRizz AI Chat">
    <meta name="twitter:description" content="Chat smart with VasanthRizz AI – your own intelligent assistant.">
    <meta name="twitter:image" content="./img/banner.png">
    <meta name="twitter:url" content="https://vasanth-rizz-5.github.io/vasanthrizz-ai/">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Light Theme */
            --bg-color: #f8faff;
            --panel-bg: #ffffff;
            --text-color: #2d3748;
            --border-color: #e2e8f0;
            --primary-color: #5a67d8;
            --primary-light: #7f9cf5;
            --primary-dark: #4c51bf;
            --secondary-color: #edf2f7;
            --menu-bg: #1a202c;
            --menu-text: #e2e8f0;
            --input-bg: #ffffff;
            --message-ai-bg: #ffffff;
            --message-user-bg: #5a67d8;
            --message-user-text: #ffffff;
            --tool-btn-bg: #ffffff;
            --welcome-text: #2d3748;
            --welcome-subtext: #718096;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --gradient-primary: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-color: #1a202c;
            --panel-bg: #2d3748;
            --text-color: #e2e8f0;
            --border-color: #4a5568;
            --primary-color: #7f9cf5;
            --primary-light: #a3bffa;
            --primary-dark: #5a67d8;
            --secondary-color: #4a5568;
            --menu-bg: #1a202c;
            --menu-text: #e2e8f0;
            --input-bg: #4a5568;
            --message-ai-bg: #2d3748;
            --message-user-bg: #5a67d8;
            --message-user-text: #ffffff;
            --tool-btn-bg: #4a5568;
            --welcome-text: #e2e8f0;
            --welcome-subtext: #a0aec0;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.25), 0 1px 2px 0 rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.25), 0 2px 4px -1px rgba(0, 0, 0, 0.2);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.25), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            --gradient-primary: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-color) 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            transition: all 0.3s ease;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
        }
        
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
            background-color: var(--panel-bg);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            text-align: center;
        }
        
        .login-logo {
            margin-bottom: 1.5rem;
        }
        
        .login-logo i {
            font-size: 2.5rem;
            color: var(--primary-color);
        }
        
        .login-title {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--welcome-text);
            background: linear-gradient(90deg, var(--primary-color), var(--primary-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .login-subtitle {
            font-size: 0.9rem;
            color: var(--welcome-subtext);
            margin-bottom: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--text-color);
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(90, 103, 216, 0.2);
        }
        
        .login-btn {
            width: 100%;
            padding: 0.75rem;
            background: var(--gradient-primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 1rem;
            box-shadow: var(--shadow-sm);
        }
        
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        
        .login-btn:active {
            transform: translateY(0);
        }
        
        .login-footer {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--welcome-subtext);
        }
        
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        /* Theme toggle */
        .theme-toggle-container {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        
        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 1.25rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .theme-toggle:hover {
            background-color: var(--secondary-color);
        }
    </style>
</head>
<body>
    <div class="theme-toggle-container">
        <button class="theme-toggle" id="themeToggle">
            <i class="fas fa-moon"></i>
        </button>
    </div>
    
    <div class="login-container">
        <div class="login-logo">
            <i class="fas fa-robot"></i>
        </div>
        <h1 class="login-title">VasanthRizz AI</h1>
        <p class="login-subtitle">Sign in to access your AI assistant</p>
        
        <form onsubmit="loginUser(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required placeholder="Enter your username">
            </div>
            
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" class="form-control" required placeholder="Enter your age" min="15">
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" required placeholder="Enter your email">
            </div>
            
            <div class="form-group" style="position: relative;">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required placeholder="Enter your password">
                
                <!-- Eye Icon -->
                <i class="fas fa-eye" id="togglePassword" style="position: absolute; top: 44px; right: 15px; cursor: pointer; color: #000000;"></i>
              </div>
              
            
            <button type="submit" class="login-btn">Login</button>
        </form>
        
       
    </div>

    <script>
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
      
        togglePassword.addEventListener("click", function () {
          const type = passwordInput.getAttribute("type") === "password" ? "text" : "password";
          passwordInput.setAttribute("type", type);
      
          // Toggle icon
          this.classList.toggle("fa-eye");
          this.classList.toggle("fa-eye-slash");
        });
        
        // Theme toggle functionality
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = themeToggle.querySelector('i');
        
        // Check for saved theme preference or use preferred color scheme
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        
        if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.remove('fa-moon');
            themeIcon.classList.add('fa-sun');
        }
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
                localStorage.setItem('theme', 'dark');
            }
        });
        
        function loginUser(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const age = document.getElementById('age').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
          
            // Store user data
            localStorage.setItem('vasanthUsername', username);
            localStorage.setItem('vasanthUserAge', age);
            localStorage.setItem('vasanthUserEmail', email);
            localStorage.setItem('vasanthUserPassword', password);
            localStorage.setItem('vasanthLoggedIn', 'true');
            
            alert("Login successful!");
            window.location.href = "index.html";
          }
    </script>


    
</body>
</html>
